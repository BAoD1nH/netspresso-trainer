model:
  task: detection
  name: yolo_fastest_v2
  checkpoint:
    #  1. Default for training
    use_pretrained: True #False -> True
    load_head: False #No change
    path: ~

    # 2. For evaluation and inference
    # use_pretrained: False
    # load_head: True
    # path: "outputs/detection_yolo_fastest_v2/version_17/detection_yolo_fastest_v2_epoch_30.safetensors"

    optimizer_path: ~
  freeze_backbone: False
  architecture:
    full: ~ # auto
    backbone:
      name: shufflenetv2
      params: 
        model_size: 0.5x
      stage_params: 
        ~
    neck:
      name: lightfpn
      params:
        out_channels: 72 
    head:
      name: yolo_fastest_head_v2
      params:
        num_classes: 4 #changed for Vietnam Vehicle Dataset
        anchors:
          &anchors
          - [12.,18., 37.,49., 52.,132.]  # P2
          - [115.,73., 119.,199., 242.,238.]  # P3
  postprocessor: 
    params:
      # postprocessor - decode
      score_thresh: 0.01
      # postprocessor - nms
      nms_thresh: 0.65
      anchors: *anchors
      class_agnostic: False
  losses:
    - criterion: yolofastest_loss
      anchors: *anchors 
      l1_activate_epoch: ~
      weight: ~
