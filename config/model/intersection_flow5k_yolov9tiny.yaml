model:
  task: detection
  name: yolov9_tiny
  checkpoint:
    ##1. Training
    # use_pretrained: true
    # load_head: false       # Reset head for 8 classes
    # path: ~                # Downloads official weights

    ##2. Evaluation and Inference
    # use_pretrained: false
    # load_head: true
    # path: "/home/baodinh/netspresso-trainer/outputs/detection_yolov9_tiny/version_2/detection_yolov9_tiny_best_fx.pt"

    # ## 3. Continue Training from a Checkpoint (epoch 30) -> epoch 50
    # use_pretrained: true
    # load_head: true
    # path: "/home/baodinh/netspresso-trainer/outputs/detection_yolov9_tiny/version_2/detection_yolov9_tiny_best_fx.pt"

    # 4. Evaluation and Inference after Continued Training
    use_pretrained: false
    load_head: true
    path:  "/home/baodinh/netspresso-trainer/outputs/detection_yolov9_tiny_graphmodule/version_0/detection_yolov9_tiny_graphmodule_epoch_20.pt"
    
    optimizer_path: ~
  freeze_backbone: false
  architecture:
    full: ~ # auto
    backbone:
      name: gelan
      params:
        stem_out_channels: 16
        stem_kernel_size: 3
        stem_stride: 2
        return_stage_idx: [1, 2, 3]
        act_type: &act_type silu
      stage_params:
        # Conv2D: ['conv', out_channels, kernel_size, stride]
        # ELAN: ['elan', out_channels, part_channels, use_identity]
        # RepNCSPELAN: ['repncspelan', out_channels, part_channels, use_identity, depth]
        # AConv: ['aconv', out_channels]
        # ADown: ['adown', out_channels]
        -
          - ['conv', 32, 3, 2]
          - ['elan', 32, 32, false]
        -
          - ['aconv', 64]
          - ['repncspelan', 64, 64, false, 3]
        -
          - ['aconv', 96]
          - ['repncspelan', 96, 96, false, 3]
        - 
          - ['aconv', 128]
          - ['repncspelan', 128, 128, false, 3]
    neck:
      name: yolov9fpn
      params:
        repeat_num: 3
        act_type: *act_type
        use_aux_loss: &use_aux_loss false
        bu_type: aconv
        spp_channels: 128
        n4_channels: 96
        p3_channels: 64
        p3_to_p4_channels: 48
        p4_channels: 96
        p4_to_p5_channels: 64
        p5_channels: 128
    head:
      name: yolo_detection_head
      params:
        version: v9
        num_classes: 8   # <--- Updated for Intersection Flow 5k
        num_anchors: 3
        anchors: &anchors
          - [10,13, 16,30, 33,23]       # P3
          - [30,61, 62,45, 59,119]      # P4
          - [116,90, 156,198, 373,326]  # P5
        use_group: true
        reg_max: &reg_max 16
        act_type: *act_type
        use_aux_loss: *use_aux_loss
  postprocessor: 
    params: 
      # postprocessor - decode
      reg_max: *reg_max
      score_thresh: 0.01
      # postprocessor - nms
      nms_thresh: 0.65
      class_agnostic: false
      anchors: *anchors  # <--- Now this reference works
  losses:
    - criterion: yolov9_loss
      weight: ~
      l1_activate_epoch: ~